name: flankr_vaul
description: >-
  A drawer for Flutter that feels native: snap points, velocity-aware flings,
  scroll hand-off, and the page behind it scaling back like an iOS sheet.
version: 0.1.3
repository: https://github.com/amansharma312/flankr-vaul
issue_tracker: https://github.com/amansharma312/flankr-vaul/issues

screenshots:
  - description: Drag a list up and the drawer grows to full height first; drag it down and it closes.
    path: screenshots/drawer.gif
  - description: A drawer that fits its content, with the page behind scaled back.
    path: screenshots/fit-content.png
  - description: Snap points, resting at half height.
    path: screenshots/snap-half.png
  - description: The same drawer at full height.
    path: screenshots/snap-full.png
  - description: Dark mode, with a second drawer opened over the first.
    path: screenshots/dark-nested.png

topics:
  - drawer
  - bottom-sheet
  - sheet
  - gestures
  - animation

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
